<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>局域网 AI 助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8cff'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ccircle cx='24' cy='34' r='7' fill='white'/%3E%3Ccircle cx='42' cy='34' r='7' fill='white'/%3E%3Crect x='18' y='44' width='30' height='6' rx='3' fill='white' opacity='0.85'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0e16; --bg2:#0d1320; --card:#121a2a; --card2:#16203a;
  --border:#1d2942; --border2:#27365c;
  --text:#e9eef8; --dim:#8c99b8; --dim2:#5d6b8c;
  --accent:#5b8cff; --accent2:#8b5cf6; --accent-grad:linear-gradient(135deg,#5b8cff,#8b5cf6);
  --ok:#3ddc84; --warn:#ffb454; --err:#ff6b6b;
  --code-bg:#090d16; --bubble-user:linear-gradient(135deg,#3564e6,#5b4df0);
  --radius:14px; --radius-sm:9px;
  --mono:Consolas,'Cascadia Mono','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',system-ui,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.65;
  background-image:radial-gradient(1200px 500px at 80% -10%,rgba(91,140,255,.08),transparent 60%),
                   radial-gradient(900px 420px at -10% 110%,rgba(139,92,246,.07),transparent 60%);
}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;max-width:1600px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}

/* ---------- 侧栏 ---------- */
.side{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 18px;gap:14px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:6px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;box-shadow:0 4px 18px rgba(91,140,255,.35);flex:none}
.brand h1{font-size:16.5px;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:12px;color:var(--dim);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px}
.card-title{font-size:12.5px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card-title .hint{font-weight:400;text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--dim2)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3.5px 0;gap:8px}
.row span:first-child{color:var(--dim)}
.row span:last-child{color:var(--text);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:none;display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(61,220,132,.6)}
.badge{font-size:12px;padding:2.5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--border2);color:var(--dim)}
.badge.busy{color:#cfe0ff;border-color:var(--accent);background:rgba(91,140,255,.12)}
.badge.wait{color:var(--warn);border-color:var(--warn);background:rgba(255,180,84,.08)}
.meter{height:7px;background:var(--code-bg);border-radius:999px;overflow:hidden;margin:2px 0 8px;border:1px solid var(--border)}
.meter-fill{height:100%;width:0%;border-radius:999px;background:var(--accent-grad);transition:width .5s ease}
.meter-fill.warn{background:linear-gradient(135deg,#ffb454,#ff7a6b)}
.side-actions{display:flex;gap:9px}
.side-actions button{flex:1;padding:9px 0;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.side-actions button:hover{border-color:var(--accent);color:#fff;background:var(--card2)}
.foot{margin-top:auto;font-size:11.5px;color:var(--dim2);text-align:center;line-height:1.8;padding-top:6px}

/* ---------- 聊天区 ---------- */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chat-head{padding:16px 26px 13px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;flex:none}
.chat-title{font-size:16px;font-weight:700}
.chat-meta{font-size:12px;color:var(--dim)}
.msgs{flex:1;overflow-y:auto;padding:22px 26px 8px;scroll-behavior:smooth}
.welcome{max-width:640px;margin:8vh auto 0;text-align:center;animation:fadein .5s ease}
.welcome .big{width:64px;height:64px;border-radius:18px;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;margin:0 auto 18px;box-shadow:0 8px 30px rgba(91,140,255,.35)}
.welcome h2{font-size:22px;margin-bottom:8px}
.welcome p{color:var(--dim);font-size:14px;margin-bottom:24px}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.chip{padding:8px 15px;border-radius:999px;border:1px solid var(--border2);background:var(--card);color:var(--dim);font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.chip:hover{color:#fff;border-color:var(--accent);background:var(--card2);transform:translateY(-1px)}
.msg{display:flex;margin:0 0 18px;gap:11px;animation:fadein .25s ease}
.msg .avatar{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.msg.user{flex-direction:row-reverse}
.msg.user .avatar{background:var(--accent-grad);color:#fff}
.msg.assistant .avatar{background:var(--card2);border:1px solid var(--border2);color:var(--accent)}
.msg .bubble{max-width:min(760px,calc(100% - 60px));min-width:0}
.msg.user .bubble{background:var(--bubble-user);color:#fff;border-radius:16px 16px 4px 16px;padding:11px 16px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;box-shadow:0 4px 16px rgba(53,100,230,.28)}
.msg.assistant .bubble{background:var(--card);border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:14px 18px;font-size:14.5px;word-break:break-word;overflow-wrap:break-word;color:#dfe6f5}
.msg.assistant .bubble p{margin:0 0 9px}
.msg.assistant .bubble p:last-child{margin-bottom:0}
.msg.assistant .bubble h2,.msg.assistant .bubble h3,.msg.assistant .bubble h4{margin:14px 0 7px;line-height:1.4}
.msg.assistant .bubble h2{font-size:17px}.msg.assistant .bubble h3{font-size:15.5px}.msg.assistant .bubble h4{font-size:14.5px}
.msg.assistant .bubble ul,.msg.assistant .bubble ol{margin:0 0 9px;padding-left:22px}
.msg.assistant .bubble li{margin:3px 0}
.msg.assistant .bubble code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);border:1px solid var(--border);border-radius:5px;padding:1.5px 6px;color:#9ecbff}
.msg.assistant .bubble pre{margin:10px 0;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.msg.assistant .bubble pre .code-head{display:flex;justify-content:space-between;align-items:center;background:var(--card2);padding:6px 13px;font-size:12px;color:var(--dim);font-family:var(--mono)}
.msg.assistant .bubble pre .code-head .lang{text-transform:uppercase;letter-spacing:.5px}
.msg.assistant .bubble pre .copy-btn{background:none;border:1px solid var(--border2);color:var(--dim);border-radius:6px;padding:2px 10px;cursor:pointer;font-size:11.5px;font-family:inherit;transition:.15s}
.msg.assistant .bubble pre .copy-btn:hover{color:#fff;border-color:var(--accent)}
.msg.assistant .bubble pre code{display:block;padding:13px 15px;overflow-x:auto;background:var(--code-bg);border:none;border-radius:0;color:#d7e2f5;font-size:13px;line-height:1.6}
.msg.assistant .bubble blockquote{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:8px 0;color:var(--dim)}
.msg.assistant .bubble strong{color:#fff}
.thinking{margin:2px 0 10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:rgba(139,92,246,.05)}
.thinking summary{cursor:pointer;padding:8px 13px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:8px;user-select:none;list-style:none}
.thinking summary::-webkit-details-marker{display:none}
.thinking .think-body{padding:2px 13px 12px;color:var(--dim);font-size:13px;white-space:pre-wrap;word-break:break-word;border-top:1px dashed var(--border);max-height:300px;overflow-y:auto}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin 0.8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.state-tag{font-size:11.5px;color:var(--dim2);margin-top:7px;display:flex;align-items:center;gap:7px}
.state-tag .spin{margin-right:2px}
.err-text{color:var(--err)}
.notice{margin:0 26px 10px;padding:9px 15px;border-radius:var(--radius-sm);background:rgba(255,180,84,.09);border:1px solid rgba(255,180,84,.35);color:var(--warn);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.notice.err{background:rgba(255,107,107,.09);border-color:rgba(255,107,107,.35);color:var(--err)}
.notice button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.notice button:hover{opacity:.8}
.input-bar{flex:none;padding:12px 26px 6px;display:flex;gap:10px;align-items:flex-end}
.input-wrap{flex:1;display:flex;background:var(--card);border:1px solid var(--border2);border-radius:16px;align-items:flex-end;transition:border-color .15s;min-width:0}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.12)}
.input-wrap textarea{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:14.5px;line-height:1.6;padding:11px 15px;resize:none;max-height:320px;min-height:44px;scrollbar-width:none;-ms-overflow-style:none}
.input-wrap textarea::-webkit-scrollbar{display:none;width:0}
.input-wrap .opt{display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--dim);font-size:12px;border-left:1px solid var(--border);align-self:center;flex:none}
.input-wrap .opt select{background:var(--code-bg);color:var(--text);border:1px solid var(--border2);border-radius:7px;padding:3px 6px;font-size:12px;font-family:inherit;outline:none}
.send-btn{flex:none;height:44px;padding:0 22px;border-radius:14px;border:none;background:var(--accent-grad);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(91,140,255,.3);transition:.15s}
.send-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.send-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.stop-btn{flex:none;height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--err);background:rgba(255,107,107,.08);color:var(--err);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.stop-btn:hover{background:rgba(255,107,107,.16)}
.disclaimer{flex:none;text-align:center;font-size:11px;color:var(--dim2);padding:7px 0 9px}

/* ---------- 响应式 ---------- */
@media (max-width:920px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);border:none}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:10px;border-right:none;border-bottom:1px solid var(--border);overflow:visible}
  .brand{flex:1;min-width:180px;padding:0}
  .logo{width:38px;height:38px;font-size:15px}
  .card{flex:1;min-width:150px;padding:10px 12px}
  .card-title{margin-bottom:6px}
  .side-actions{flex:none}
  .foot{display:none}
  .chat-head{padding:12px 16px 10px}
  .msgs{padding:16px 14px 6px}
  .input-bar{padding:10px 14px 4px}
  .msg .bubble{max-width:calc(100% - 48px)}
  .welcome{margin-top:4vh}
}
</style>
</head>
<body>
<div class="app">
  <!-- 侧栏 -->
  <aside class="side">
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <h1>局域网 AI 助手</h1>
        <div class="sub">DeepSeek · 离线运行 · 单用户轮流对话</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">服务器</div>
      <div class="row"><span>状态</span><span><span class="dot" id="srvDot"></span>&nbsp;<span id="srvState">连接中…</span></span></div>
      <div class="row"><span>访问地址</span><span id="srvAddr">-</span></div>
      <div class="row"><span>模型</span><span id="srvModel">DeepSeek 1.5B</span></div>
      <div class="row"><span>运行时长</span><span id="srvUptime">-</span></div>
    </div>

    <div class="card">
      <div class="card-title">上下文窗口 <span class="hint">本轮对话</span></div>
      <div class="meter"><div class="meter-fill" id="ctxFill"></div></div>
      <div class="row"><span>已用(约) / 总量</span><span id="ctxUsed">-</span></div>
      <div class="row"><span>剩余可用</span><span id="ctxLeft">-</span></div>
    </div>

    <div class="card">
      <div class="card-title">对话队列</div>
      <div class="row"><span>你的状态</span><span id="queueState" class="badge">空闲</span></div>
      <div class="row"><span>排队人数</span><span id="queueLen">0</span></div>
      <div class="row"><span>生成速度</span><span id="genSpeed">-</span></div>
    </div>

    <div class="side-actions">
      <button id="btnNew" title="清空当前浏览器中的对话记录">＋ 新对话</button>
      <button id="btnExport" title="将对话记录保存为文本文件">⬇ 导出</button>
    </div>

    <div class="foot">模型在本机运行，内容不出局域网<br>对话记录仅保存在您的浏览器中</div>
  </aside>

  <!-- 聊天区 -->
  <main class="chat">
    <header class="chat-head">
      <div class="chat-title">对话</div>
      <div class="chat-meta"><span id="histLen">0</span> 条消息 · 历史保存在本浏览器</div>
    </header>

    <div class="msgs" id="msgs"></div>

    <div class="notice" id="notice" hidden></div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
        <div class="opt">输出
          <select id="maxTok" title="单次回答最大长度">
            <option value="512">512</option>
            <option value="1024">1024</option>
            <option value="2048" selected>2048</option>
            <option value="4096">4096</option>
          </select>
        </div>
      </div>
      <button class="send-btn" id="btnSend">发送</button>
      <button class="stop-btn" id="btnStop" hidden>■ 停止</button>
    </div>
    <div class="disclaimer">AI 生成内容仅供参考 · 请勿输入敏感信息</div>
  </main>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const LS_HIST = 'lanai_history_v1';
const LS_ID = 'lanai_client_id_v1';
const SS_TICKET = 'lanai_ticket_v1';

let clientId = localStorage.getItem(LS_ID);
if (!clientId) { clientId = (crypto.randomUUID ? crypto.randomUUID() : 'c'+Date.now()+Math.random().toString(16).slice(2)); localStorage.setItem(LS_ID, clientId); }

let history = [];
try { history = JSON.parse(localStorage.getItem(LS_HIST) || '[]'); } catch(e) { history = []; }
if (!Array.isArray(history)) history = [];

let busy = false;          // 是否有请求在进行（排队或生成）
let ticket = sessionStorage.getItem(SS_TICKET) || null;
let lastTokenCount = 0;    // 上次采样的 tokens（用于测速）
let lastSpeedTime = 0;
let curSpeed = 0;
let serverInfo = { llama_ok:false, ctx_size:4096, n_past:0, ips:[], port:0, uptime_s:0 };
let serverOnline = false;
let stopRequested = false;

// ---------- 工具 ----------
function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; return h>0?`${h}时${m}分`:m>0?`${m}分${s}秒`:`${s}秒`; }
function estTokens(s){ let cjk=0,other=0; for(const ch of s){ const cp=ch.codePointAt(0); if(cp>=0x4e00&&cp<=0x9fff) cjk++; else other++; } return Math.max(1, cjk + Math.floor(other/4)); }

function stripThinkingFrom(content){
  content = content.replace(/<\s*(think|思考|thinking)\s*>[\s\S]*?<\s*\/\s*(think|思考|thinking)\s*>/gi, '');
  content = content.replace(/<\s*(think|思考|thinking)\s*>[\s\S]*$/gi, '');
  return content;
}

function localCtxEstimate(){
  let tot = 90; // 系统提示
  for (const h of history) tot += estTokens(stripThinkingFrom(h.content));
  return tot;
}

function splitThinking(text){
  const parts = [];
  const re = /<\s*\/?\s*(think|思考|thinking)\s*>/gi;
  let open = false, last = 0, m;
  const flush = (end, isThink) => {
    const seg = text.slice(last, end);
    if (seg) parts.push({ t: isThink ? 'think' : 'text', c: seg });
    last = end;
  };
  while ((m = re.exec(text)) !== null) {
    const isClose = /^\s*<\s*\//.test(m[0]);
    if (!isClose && !open) { flush(m.index, false); open = true; last = m.index + m[0].length; }
    else if (isClose && open) { flush(m.index, true); open = false; last = m.index + m[0].length; }
  }
  flush(text.length, open);
  return { parts, thinkingOpen: open };
}

// ---------- 轻量 Markdown 渲染 ----------
function renderMd(text){
  const codes = [];
  let t = text.replace(/```([\w+#\-.]*)[ \t]*\n?([\s\S]*?)```/g, (m, lang, code) => {
    codes.push({ lang: lang.trim() || 'code', code });
    return '\u0000C' + (codes.length - 1) + '\u0000';
  });
  t = esc(t);
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/^###### (.*)$/gm, '<h4>$1</h4>');
  t = t.replace(/^##### (.*)$/gm, '<h4>$1</h4>');
  t = t.replace(/^#### (.*)$/gm, '<h4>$1</h4>');
  t = t.replace(/^### (.*)$/gm, '<h4>$1</h4>');
  t = t.replace(/^## (.*)$/gm, '<h3>$1</h3>');
  t = t.replace(/^# (.*)$/gm, '<h2>$1</h2>');
  t = t.replace(/^&gt; ?(.*)$/gm, '<blockquote>$1</blockquote>');

  // 列表（按行分组）
  const lines = t.split('\n');
  const out = [];
  let inUl = false, inOl = false, inP = false;
  const closeLists = () => { if(inUl){out.push('</ul>');inUl=false;} if(inOl){out.push('</ol>');inOl=false;} };
  const closeP = () => { if(inP){out.push('</p>');inP=false;} };
  for (const line of lines) {
    let mm;
    if ((mm = line.match(/^\s*[-*] (.*)$/))) {
      closeP(); if(!inUl){out.push('<ul>');inUl=true;}
      out.push('<li>' + mm[1] + '</li>');
    } else if ((mm = line.match(/^\s*(\d+)\. (.*)$/))) {
      closeP(); if(!inOl){out.push('<ol>');inOl=true;}
      out.push('<li>' + mm[2] + '</li>');
    } else if (/^\s*$/.test(line)) {
      closeLists(); closeP();
    } else {
      closeLists();
      if (!inP) { out.push('<p>'); inP = true; } else out.push('<br>');
      out.push(line);
    }
  }
  closeLists(); closeP();
  t = out.join('\n');

  // 还原代码块
  t = t.replace(/\u0000C(\d+)\u0000/g, (m, i) => {
    const c = codes[+i];
    return '<pre><div class="code-head"><span class="lang">' + esc(c.lang) + '</span><button class="copy-btn" data-code="' +
      esc(c.code).replace(/"/g,'&quot;') + '">复制</button></div><code>' + esc(c.code) + '</code></pre>';
  });
  return t;
}

// ---------- 渲染消息 ----------
function msgEl(role, text){
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? '我' : 'AI';
  el.appendChild(av);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'user') {
    bubble.textContent = text;
  } else {
    bubble.innerHTML = renderAssistant(text);
  }
  el.appendChild(bubble);
  return el;
}

function renderAssistant(text){
  const { parts, thinkingOpen } = splitThinking(text);
  let html = '';
  for (const p of parts) {
    if (p.t === 'think') {
      const live = thinkingOpen && p === parts[parts.length - 1];
      html += '<details class="thinking"' + (live ? ' open' : '') + '>' +
              '<summary>' + (live ? '<span class="spin"></span> 正在思考…' : '🧠 已深度思考（点击展开）') + '</summary>' +
              '<div class="think-body">' + esc(p.c) + '</div></details>';
    } else {
      html += renderMd(p.c);
    }
  }
  return html;
}

function autoscroll(){
  const m = $('#msgs');
  if (m.scrollHeight - m.scrollTop - m.clientHeight < 160) m.scrollTop = m.scrollHeight;
}

function saveHist(){
  try { localStorage.setItem(LS_HIST, JSON.stringify(history)); } catch(e) {}
  $('#histLen').textContent = history.length;
}

function renderAll(){
  const m = $('#msgs');
  m.innerHTML = '';
  if (history.length === 0) {
    m.innerHTML = '<div class="welcome">' +
      '<div class="big">AI</div><h2>你好，我是本地运行的 AI 助手</h2>' +
      '<p>模型 DeepSeek 正在这台电脑上运行，所有内容都不出局域网。<br>我可以回答问题、写代码、解释概念……</p>' +
      '<div class="chips">' +
      '<button class="chip">用 Python 写一个批量重命名文件的脚本</button>' +
      '<button class="chip">用 Python 抓取一个网页的标题</button>' +
      '<button class="chip">解释一下什么是递归</button>' +
      '<button class="chip">用 Python 写一个贪吃蛇小游戏</button>' +
      '</div></div>';
    m.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { $('#input').value = c.textContent; sendMsg(); }));
  } else {
    for (const h of history) m.appendChild(msgEl(h.role, h.content));
  }
  autoscroll();
}

// ---------- 提示条 ----------
let noticeTimer = null;
function showNotice(text, isErr){
  const n = $('#notice');
  n.innerHTML = '<span>' + esc(text) + '</span><button>知道了</button>';
  n.className = 'notice' + (isErr ? ' err' : '');
  n.hidden = false;
  n.querySelector('button').onclick = () => n.hidden = true;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { n.hidden = true; }, 8000);
}

// ---------- 发送 ----------
function buildPayload(){
  const sys = { role: 'system', content: '你是一个运行在用户本地电脑上的 AI 助手（DeepSeek）。请优先使用中文回答（除非用户使用其他语言）。你擅长编写代码，尤其是 Python：写代码时给出完整、可直接运行的代码块并附简短说明。回答应清晰、准确、有条理。' };
  const msgs = [sys];
  for (const h of history) {
    let content = h.content;
    if (h.role === 'assistant') {
      // 发送时移除思考块内容，节省上下文
      content = stripThinkingFrom(content);
    }
    msgs.push({ role: h.role, content });
  }
  return msgs;
}

async function sendMsg(){
  const text = $('#input').value.trim();
  if (!text || busy) return;
  if (text.length > 20000) { showNotice('消息过长，请缩短后再发送', true); return; }

  busy = true;
  stopRequested = false;
  curSpeed = 0;
  $('#input').value = '';
  autoGrow();
  setBusyUI(true);

  history.push({ role: 'user', content: text });
  saveHist();
  renderAll();

  // 助手占位气泡
  const placeholder = msgEl('assistant', '');
  $('#msgs').appendChild(placeholder);
  const bubble = placeholder.querySelector('.bubble');
  bubble.innerHTML = '<div class="state-tag"><span class="spin"></span> 正在提交…</div>';
  autoscroll();

  let resp;
  try {
    resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client: clientId, messages: buildPayload(), max_tokens: +$('#maxTok').value || 2048 })
    });
  } catch(e) {
    finishWithError('无法连接服务器，请检查服务是否在运行', bubble);
    return;
  }
  let data;
  try { data = await resp.json(); } catch(e) { finishWithError('服务器响应异常', bubble); return; }
  if (!resp.ok || data.error) {
    finishWithError(data.error || '请求失败', bubble);
    return;
  }
  ticket = data.ticket;
  sessionStorage.setItem(SS_TICKET, ticket);
  if (data.position > 0) bubble.innerHTML = '<div class="state-tag"><span class="spin"></span> 排队中 · 第 ' + (data.position) + ' 位</div>';
  else bubble.innerHTML = '<div class="state-tag"><span class="spin"></span> 正在准备…</div>';
  pollResult(bubble);
}

function setBusyUI(b){
  $('#btnSend').disabled = b;
  $('#btnStop').hidden = !b;
  $('#btnSend').hidden = b;
}

function finishWithError(msg, bubble){
  // 移除空的占位气泡并提示
  if (bubble) {
    bubble.innerHTML = '<span class="err-text">⚠ ' + esc(msg) + '</span>';
  } else {
    const last = $('#msgs').lastElementChild;
    if (last && last.classList.contains('assistant')) {
      last.querySelector('.bubble').innerHTML = '<span class="err-text">⚠ ' + esc(msg) + '</span>';
    } else {
      showNotice(msg, true);
    }
  }
  busy = false; ticket = null;
  sessionStorage.removeItem(SS_TICKET);
  setBusyUI(false);
}

// ---------- 轮询结果 ----------
async function pollResult(bubble){
  if (!ticket) return;
  let data;
  try {
    const r = await fetch('/api/result?ticket=' + encodeURIComponent(ticket));
    data = await r.json();
  } catch(e) {
    if (!busy) return;
    setTimeout(() => pollResult(bubble), 2000);
    return;
  }
  const st = data.state;
  if (st === 'queued') {
    bubble.innerHTML = '<div class="state-tag"><span class="spin"></span> 排队中' +
      (data.position > 0 ? ' · 前面还有 ' + data.position + ' 位' : ' · 马上轮到您') + '</div>';
    setTimeout(() => pollResult(bubble), 1200);
    return;
  }
  if (st === 'generating') {
    bubble.innerHTML = renderAssistant(data.text || '');
    autoscroll();
    setTimeout(() => pollResult(bubble), 350);
    return;
  }
  if (st === 'done') {
    const text = data.text || '';
    let tag = '用时 ' + Math.round(data.elapsed_s || 0) + 's';
    if (data.prompt_tokens) tag += ' · 输入 ' + Math.round(data.prompt_tokens) + ' tokens';
    if (data.completion_tokens) tag += ' · 输出 ' + Math.round(data.completion_tokens) + ' tokens';
    if (data.truncated) tag += ' · ⚠ 已达最大长度';
    bubble.innerHTML = renderAssistant(text) + '<div class="state-tag">' + tag + '</div>';
    history.push({ role: 'assistant', content: text });
    saveHist();
    busy = false; ticket = null;
    sessionStorage.removeItem(SS_TICKET);
    setBusyUI(false);
    if (data.trimmed) showNotice('对话较长，较早的 ' + data.removed + ' 条消息已超出上下文被自动省略');
    if (data.truncated) showNotice('回答达到最大输出长度被截断，可在输入框右侧增大“输出”长度后继续追问');
    autoscroll();
    return;
  }
  if (st === 'cancelled') {
    const text = data.text || '';
    bubble.innerHTML = renderAssistant(text) + '<div class="state-tag">⏹ 已停止生成</div>';
    if (text.trim()) { history.push({ role: 'assistant', content: text }); saveHist(); }
    busy = false; ticket = null;
    sessionStorage.removeItem(SS_TICKET);
    setBusyUI(false);
    return;
  }
  // error
  bubble.innerHTML = '<span class="err-text">⚠ ' + esc(data.error || '生成失败') + '</span>';
  busy = false; ticket = null;
  sessionStorage.removeItem(SS_TICKET);
  setBusyUI(false);
}

// ---------- 停止 ----------
async function stopGen(){
  if (!ticket) return;
  stopRequested = true;
  try {
    await fetch('/api/cancel', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ticket }) });
  } catch(e) {}
}

// ---------- 服务器状态轮询 ----------
async function pollStatus(){
  try {
    const r = await fetch('/api/status?client=' + encodeURIComponent(clientId), { cache: 'no-store' });
    const d = await r.json();
    serverOnline = true;
    serverInfo = d;
    $('#srvDot').className = 'dot ' + (d.llama_ok ? 'ok' : '');
    $('#srvState').textContent = d.llama_ok ? '运行中' : '引擎异常';
    if (d.ips && d.ips.length) $('#srvAddr').textContent = d.ips[0] + ':' + d.port;
    else $('#srvAddr').textContent = '127.0.0.1:' + d.port;
    $('#srvModel').textContent = (d.model || 'DeepSeek').replace(/\.gguf$/i,'').slice(0,40);
    $('#srvUptime').textContent = fmtTime(d.uptime_s);

    const ctx = d.ctx_size || 4096;
    const used = localCtxEstimate();
    const pct = Math.min(100, used / ctx * 100);
    const fill = $('#ctxFill');
    fill.style.width = pct.toFixed(1) + '%';
    fill.className = 'meter-fill' + (pct > 80 ? ' warn' : '');
    $('#ctxUsed').textContent = used.toLocaleString() + ' / ' + ctx.toLocaleString();
    $('#ctxLeft').textContent = Math.max(0, ctx - used).toLocaleString() + ' tokens';

    // 队列状态（完全由服务器数据驱动，任何人生成时都会实时刷新）
    const pos = d.your_position;
    const qs = $('#queueState');
    if (busy) {
      if (pos === 0) { qs.textContent = '生成中…'; qs.className = 'badge busy'; }
      else if (pos > 0) { qs.textContent = '排队第 ' + pos + ' 位'; qs.className = 'badge wait'; }
      else { qs.textContent = '处理中'; qs.className = 'badge busy'; }
    } else if (d.active) {
      qs.textContent = '他人使用中'; qs.className = 'badge wait';
    } else {
      qs.textContent = '空闲'; qs.className = 'badge';
    }
    $('#queueLen').textContent = d.queue_len || 0;

    // 测速：只要有活动任务就实时显示（不限于是不是自己的请求）
    if (d.active && d.active.tokens_so_far !== undefined) {
      const tk = d.active.tokens_so_far;
      const now = Date.now();
      if (lastSpeedTime > 0) {
        const dt = (now - lastSpeedTime) / 1000;
        if (dt > 0.4) { curSpeed = (tk - lastTokenCount) / dt; }
      }
      lastSpeedTime = now; lastTokenCount = tk;
      if (curSpeed > 0.05) $('#genSpeed').textContent = curSpeed.toFixed(1) + ' tok/s';
      else $('#genSpeed').textContent = '启动中…';
    } else if (!d.active) {
      lastSpeedTime = 0; lastTokenCount = 0; curSpeed = 0;
      $('#genSpeed').textContent = '-';
    }
  } catch(e) {
    serverOnline = false;
    $('#srvDot').className = 'dot';
    $('#srvState').textContent = '已断开';
  }
}

// ---------- 会话恢复（刷新页面后） ----------
function resumeIfNeeded(){
  const t = sessionStorage.getItem(SS_TICKET);
  if (!t) return;
  if (history.length === 0 || history[history.length-1].role !== 'user') return;
  busy = true;
  ticket = t;
  setBusyUI(true);
  const placeholder = msgEl('assistant', '');
  $('#msgs').appendChild(placeholder);
  const bubble = placeholder.querySelector('.bubble');
  bubble.innerHTML = '<div class="state-tag"><span class="spin"></span> 正在恢复会话…</div>';
  pollResult(bubble);
}

// ---------- 其他 ----------
function autoGrow(){
  const ta = $('#input');
  ta.style.height = 'auto';
  ta.style.height = Math.min(320, ta.scrollHeight) + 'px';
}

$('#btnSend').addEventListener('click', sendMsg);
$('#btnStop').addEventListener('click', stopGen);
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); }
});
$('#input').addEventListener('input', autoGrow);
$('#btnNew').addEventListener('click', () => {
  if (history.length === 0) return;
  if (!confirm('开始新对话？当前浏览器中的聊天记录将被清空。')) return;
  history = [];
  saveHist();
  renderAll();
});
$('#btnExport').addEventListener('click', () => {
  if (history.length === 0) { showNotice('当前没有对话内容'); return; }
  let txt = '局域网 AI 助手 对话记录\n导出时间: ' + new Date().toLocaleString() + '\n' + '='.repeat(50) + '\n\n';
  for (const h of history) {
    txt += (h.role === 'user' ? '【我】' : '【AI】') + '\n' + h.content + '\n\n' + '-'.repeat(40) + '\n\n';
  }
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '对话记录_' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});
document.addEventListener('click', e => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  const code = btn.getAttribute('data-code') || '';
  const done = () => { btn.textContent = '已复制 ✓'; setTimeout(() => btn.textContent = '复制', 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(done).catch(() => { fallbackCopy(code); done(); });
  } else { fallbackCopy(code); done(); }
});
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

// ---------- 启动 ----------
renderAll();
saveHist();
resumeIfNeeded();
pollStatus();
setInterval(pollStatus, 1500);
// 切回页面或窗口获得焦点时立即刷新，避免后台节流导致数据不更新
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollStatus(); });
window.addEventListener('focus', pollStatus);
$('#input').focus();
</script>
