; ============================================
; 局域网 AI 聊天服务器 配置文件（可选）
; 修改后重启服务器生效
; ============================================

; HTTP 服务端口（默认 9090，被占用时自动每次 +5 寻找空闲端口）
Port = 9090

; 上下文窗口大小（tokens），越大占用内存越多，默认 4096
CtxSize = 4096

; 单次回答最大输出长度（tokens），默认 2048
MaxTokens = 2048

; 模型文件名（放在 models 文件夹内），默认：
Model = DeepSeek-R1-Distill-Qwen-1.5B-Q3_K_M.gguf

; MTP（多 token 预测）投机解码：0 = 关闭（默认），1 = 开启
; 注意：仅当模型 GGUF 文件自带 MTP 头（mtp.* 张量）时有效。
; 当前默认模型不支持 MTP；请换成带 MTP 头的模型后再开启。
Mtp = 0

; 每次草稿预测的 token 数（Mtp = 1 时生效，默认 3，范围 1~8）
MtpDraft = 3
